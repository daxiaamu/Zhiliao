name: Publish compatibility config

on:
  push:
    branches: [master]
    paths:
      - update/compatibility-v1.json

permissions:
  contents: write

concurrency:
  group: publish-compatibility-config
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Validate config and generate CDN manifest
        run: |
          python scripts/compatibility/catalog.py validate \
            --catalog update/compatibility-v1.json
          jq -e '
            .schemaVersion == 1 and
            (.revision | type == "number") and .revision > 0 and
            .targetPackage == "com.zhihu.android" and
            (.compatibilityUrl | startswith("https://")) and
            (.profiles | type == "array")
          ' update/compatibility-v1.json
          revision=$(jq -r .revision update/compatibility-v1.json)
          sha256=$(sha256sum update/compatibility-v1.json | awk '{print $1}')
          jq -n \
            --argjson revision "$revision" \
            --arg sha256 "$sha256" \
            '{
              schemaVersion: 1,
              revision: $revision,
              sha256: $sha256,
              urls: [
                "https://raw.githubusercontent.com/daxiaamu/Zhiliao/master/update/compatibility-v1.json",
                "https://cdn.jsdelivr.net/gh/daxiaamu/Zhiliao@master/update/compatibility-v1.json",
                "https://fastly.jsdelivr.net/gh/daxiaamu/Zhiliao@master/update/compatibility-v1.json",
                "https://gcore.jsdelivr.net/gh/daxiaamu/Zhiliao@master/update/compatibility-v1.json",
                "https://testingcf.jsdelivr.net/gh/daxiaamu/Zhiliao@master/update/compatibility-v1.json",
                "https://cdn.statically.io/gh/daxiaamu/Zhiliao/master/update/compatibility-v1.json"
              ]
            }' > update/compatibility-manifest.json

      - name: Commit generated manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update/compatibility-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update compatibility manifest [skip ci]"
          git push origin HEAD:master
