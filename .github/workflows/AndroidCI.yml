name: Android CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: Exact version name for a release build
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Retrieve version
        env:
          RELEASE_VERSION: ${{ inputs.version_name }}
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | head -c 7)
          APP_VER_NAME=$(grep '^appVerName=' gradle.properties | cut -d'=' -f2)
          if [ -n "$RELEASE_VERSION" ]; then
            echo VERSION=$RELEASE_VERSION >> $GITHUB_ENV
          else
            echo VERSION=${APP_VER_NAME}_${COMMIT_HASH} >> $GITHUB_ENV
          fi
      - name: Test compatibility config and build CI snapshot
        run: bash ./gradlew -PappVerName=${{ env.VERSION }} testDebugUnitTest assembleDebug
      - name: Upload CI snapshot
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Zhiliao_CI_${{ env.VERSION }}
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Send commit to telegram
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |+
            New push to github!
            *${{ github.event.head_commit.message }}* by ${{ github.event.head_commit.author.name }}
            See commit detail [here](${{ github.event.head_commit.url }})
            Snapshot apk is attached
          document: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk
